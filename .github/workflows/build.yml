name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every run gets a higher version, so the auto-updaters on PC and phone see it as newer.
  # 1.2.x and phone codes above 100 stay ahead of the 1.1.x builds made before the move to a new repository.
  VERSION: "1.2.${{ github.run_number }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e "host[dev,windows-media]"
      - name: Fetch org.json for the Java interop test
        if: runner.os == 'Linux'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/json.jar" https://repo1.maven.org/maven2/org/json/json/20250517/json-20250517.jar
          echo "MDOCK_JSON_JAR=$RUNNER_TEMP/json.jar" >> "$GITHUB_ENV"
      - run: python -m pytest -q host/tests -rs

  windows-exe:
    name: Windows host .exe
    needs: host-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install "./host[windows-media]" "pyinstaller>=6.22"
      - name: Stamp version
        shell: pwsh
        run: Set-Content -Path host/mobiledock_host/__init__.py -Value "__version__ = `"$env:VERSION`""
      - name: Build
        working-directory: host
        run: pyinstaller --noconfirm --onefile --windowed --name MobileDockHost --collect-submodules winrt --collect-submodules pycaw --collect-submodules comtypes --hidden-import segno run_host.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MobileDockHost-windows
          path: host/dist/MobileDockHost.exe

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.MDOCK_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MDOCK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build and lint
        working-directory: android
        env:
          MDOCK_KEYSTORE_PASSWORD: ${{ secrets.MDOCK_KEYSTORE_PASSWORD }}
          MDOCK_VERSION_NAME: ${{ env.VERSION }}
        run: ./gradlew --no-daemon lint assembleDebug assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MobileDock-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports/lint-results-*.html

  screenshots:
    name: Phone screenshots
    # Boots a 720p landscape Android phone, opens every page in demo mode and saves a picture of each.
    # Demo mode shows sample data instead of a PC and only works in the debug build.
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MobileDock-android
          path: apk
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start a 720p landscape phone
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          image="system-images;android-34;default;x86_64"
          yes | "$sdk/sdkmanager" "emulator" "platform-tools" "$image" > /dev/null
          echo no | "$sdk/avdmanager" create avd -n dock -k "$image" -d pixel --force
          cfg="$HOME/.android/avd/dock.avd/config.ini"
          sed -i '/^hw.lcd/d;/^hw.gpu/d;/^showDeviceFrame/d' "$cfg"
          printf 'hw.lcd.width=1280\nhw.lcd.height=720\nhw.lcd.density=320\nhw.gpu.enabled=yes\nhw.gpu.mode=swiftshader_indirect\nshowDeviceFrame=no\n' >> "$cfg"
          nohup "$ANDROID_HOME/emulator/emulator" -avd dock -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" wait-for-device
          for i in $(seq 1 100); do
            [ "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break
            sleep 3
          done
          "$adb" shell settings put global window_animation_scale 0
          "$adb" shell settings put global transition_animation_scale 0
          "$adb" shell settings put global animator_duration_scale 0
          "$adb" shell wm dismiss-keyguard || true
          "$adb" shell svc power stayon true
      - name: Screenshot every page
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" install -r "$(find apk -name app-debug.apk | head -1)"
          mkdir shots
          pages="-1:connect 0:apps 1:playing 2:shortcuts 3:controls 4:capture 5:touch 6:stats 7:settings"
          n=0
          for entry in $pages; do
            page="${entry%%:*}"; name="${entry#*:}"; n=$((n + 1))
            "$adb" shell am start -W -n dev.mobiledock/.MainActivity --ez demo true --ei page "$page" > /dev/null
            sleep 5  # icons, album art and a few seconds of stats graphs
            "$adb" exec-out screencap -p > "shots/$(printf %02d $n)-$name.png"
          done
          ls -l shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: phone-screenshots
          path: |
            shots/*.png
            ${{ runner.temp }}/emulator.log

  release:
    name: GitHub release
    # Every push to main becomes a release. The PC and phone updaters install from the latest one.
    # Run workflow on main in the Actions tab also makes a release.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [windows-exe, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # signs the build attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          mkdir out
          cp dist/MobileDockHost-windows/MobileDockHost.exe out/
          exe_sha=$(sha256sum out/MobileDockHost.exe | cut -d' ' -f1)
          signed=dist/MobileDock-android/outputs/apk/release/app-release.apk
          if [ -f "$signed" ]; then
            cp "$signed" "out/MobileDock-$VERSION.apk"
            apk_sha=$(sha256sum "out/MobileDock-$VERSION.apk" | cut -d' ' -f1)
            android="{\"file\":\"MobileDock-$VERSION.apk\",\"code\":$((GITHUB_RUN_NUMBER + 100)),\"sha256\":\"$apk_sha\"}"
          else
            # Without the signing secrets each build has a different key, so phones could not update.
            echo "::warning::No release signing key. Phones will not auto-update. See android/README.md."
            cp dist/MobileDock-android/outputs/apk/debug/app-debug.apk "out/MobileDock-$VERSION-debug.apk"
            android=null
          fi
          printf '{"version":"%s","windows":{"file":"MobileDockHost.exe","sha256":"%s"},"android":%s}\n' \
            "$VERSION" "$exe_sha" "$android" > out/latest.json
          cat out/latest.json
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Attest build provenance
        # Lets anyone check that a download was built here, from this exact commit.
        # Free for public repositories, so it is skipped while the repository is private.
        if: ${{ !github.event.repository.private && env.TAG != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/MobileDockHost.exe
            out/*.apk
      - name: Create release
        if: ${{ env.TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Mobile Dock $VERSION" --notes "Automatic build of $GITHUB_SHA. The apps update themselves." \
            out/*
