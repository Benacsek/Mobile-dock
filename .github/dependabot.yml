version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      updates:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      updates:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /host
    schedule:
      interval: weekly
    groups:
      updates:
        patterns: ["*"]
